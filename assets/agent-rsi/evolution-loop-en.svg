<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img"><title>What changes, and what is inherited?</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#235a93" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#182d46"><text x="35" y="45" text-anchor="start" font-size="27" fill="#182d46" font-weight="600">What changes, and what is inherited?</text><rect x="35" y="140" width="210" height="125" rx="5" fill="#f2f6fa" stroke="#c8d4df"/><text x="140.0" y="195.0" text-anchor="middle" font-size="24" fill="#182d46" font-weight="600">Improver</text><text x="140.0" y="226.0" text-anchor="middle" font-size="21" fill="#182d46" font-weight="400">Propose a change</text><rect x="300" y="120" width="320" height="165" rx="5" fill="#f2f6fa" stroke="#c8d4df"/><text x="460.0" y="179.5" text-anchor="middle" font-size="24" fill="#182d46" font-weight="600">Agent components</text><text x="460.0" y="210.5" text-anchor="middle" font-size="21" fill="#182d46" font-weight="400">Prompts · memory · skills</text><text x="460.0" y="241.5" text-anchor="middle" font-size="21" fill="#182d46" font-weight="400">Workflow · code · weights</text><rect x="680" y="140" width="245" height="125" rx="5" fill="#f2f6fa" stroke="#c8d4df"/><text x="802.5" y="195.0" text-anchor="middle" font-size="24" fill="#182d46" font-weight="600">Execute &amp; evaluate</text><text x="802.5" y="226.0" text-anchor="middle" font-size="21" fill="#182d46" font-weight="400">Measure the change</text><path d="M245 202 H292" fill="none" stroke="#235a93" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M620 202 H672" fill="none" stroke="#235a93" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M803 265 V365 H460 V293" fill="none" stroke="#235a93" stroke-width="2.5" marker-end="url(#arrow)"/><text x="658" y="352" text-anchor="middle" font-size="23" fill="#182d46" font-weight="400">Select → retain → inherit</text><path d="M803 140 V83 H140 V132" fill="none" stroke="#235a93" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="488" y="74" text-anchor="middle" font-size="22" fill="#235a93" font-weight="400">RSI: the improver can also change</text><text x="480" y="428" text-anchor="middle" font-size="23" fill="#58687b" font-weight="400">The evaluation signal decides which changes survive.</text></g></svg>