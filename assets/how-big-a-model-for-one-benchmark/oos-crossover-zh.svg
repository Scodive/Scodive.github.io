<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title-zh desc-zh">
  <title id="title-zh">CLINC150 的排名取决于域外请求占比</title>
  <desc id="desc-zh">当域外请求占比从 0% 变化到 35% 时，本地 BGE-small 与 GPT-5.6 Luna 的准确率差值变化曲线。两者在 17.6% 处持平，官方测试集占比 18.2% 时本地模型领先 +0.09 个百分点。</desc>
  <rect width="960" height="480" fill="#fafbfd"/>
  <g font-family="PingFang SC, Microsoft YaHei, Lato, sans-serif">
    <!-- Header -->
    <text x="48" y="46" font-size="22" font-weight="700" fill="#14263d">CLINC150 的排名取决于域外请求占比</text>
    <text x="48" y="74" font-size="15" fill="#526478">本地 BGE-small 减去 GPT-5.6 Luna（百分点），按实测的域内与域外命中率线性重算</text>

    <!-- Plot Background -->
    <rect x="110" y="110" width="770" height="270" fill="#ffffff"/>
    <rect x="497.6" y="110" width="382.4" height="270" fill="#f4f7fb" opacity="0.65"/>

    <!-- Horizontal Gridlines & Y Ticks -->
    <g stroke="#e6ecf2" stroke-width="1">
      <line x1="110" y1="110" x2="880" y2="110"/>
      <line x1="110" y1="155" x2="880" y2="155"/>
      <line x1="110" y1="200" x2="880" y2="200"/>
      <line x1="110" y1="290" x2="880" y2="290"/>
      <line x1="110" y1="335" x2="880" y2="335"/>
      <line x1="110" y1="380" x2="880" y2="380"/>
    </g>
    <line x1="110" y1="245" x2="880" y2="245" stroke="#8b9bb0" stroke-width="1.25"/>

    <!-- Y-axis Labels -->
    <g font-size="13" fill="#526478" text-anchor="end">
      <text x="96" y="115">+3</text>
      <text x="96" y="160">+2</text>
      <text x="96" y="205">+1</text>
      <text x="96" y="250">0</text>
      <text x="96" y="295">−1</text>
      <text x="96" y="340">−2</text>
      <text x="96" y="385">−3</text>
    </g>

    <!-- X-axis Ticks & Labels -->
    <g font-size="13" fill="#526478" text-anchor="middle">
      <text x="110" y="405">0%</text>
      <text x="220" y="405">5%</text>
      <text x="330" y="405">10%</text>
      <text x="440" y="405">15%</text>
      <text x="550" y="405">20%</text>
      <text x="660" y="405">25%</text>
      <text x="770" y="405">30%</text>
      <text x="880" y="405">35%</text>
    </g>
    <text x="495" y="442" font-size="14" font-weight="600" fill="#14263d" text-anchor="middle">域外请求占比（%）</text>

    <!-- Region labels -->
    <text x="128" y="136" font-size="13" font-weight="600" fill="#526478">Luna 领先</text>
    <text x="514" y="136" font-size="13" font-weight="600" fill="#1e538a" text-anchor="start">本地 BGE 领先</text>

    <!-- Vertical tie line at 17.6% -->
    <line x1="497.6" y1="110" x2="497.6" y2="380" stroke="#7c8ea4" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="484" y="136" font-size="13" font-weight="600" fill="#526478" text-anchor="end">17.6% 持平点</text>

    <!-- Accuracy gap line -->
    <line x1="110" y1="373.0" x2="880" y2="118.7" stroke="#14263d" stroke-width="3" stroke-linecap="round"/>

    <!-- Callout 1: 10% OOS -->
    <line x1="330" y1="300.35" x2="275" y2="215" stroke="#1e538a" stroke-width="1.5"/>
    <circle cx="330" cy="300.35" r="5.5" fill="#1e538a" stroke="#ffffff" stroke-width="2"/>
    <text x="275" y="188" font-size="13.5" font-weight="700" fill="#1e538a" text-anchor="middle">10% 域外流量</text>
    <text x="275" y="206" font-size="13.5" font-weight="600" fill="#14263d" text-anchor="middle">−1.23 pp（94.96% 对 96.19%）</text>

    <!-- Callout 2: Official test mix 18.2% -->
    <line x1="510" y1="240.9" x2="585" y2="312" stroke="#ba672f" stroke-width="1.5"/>
    <circle cx="510" cy="240.9" r="5.5" fill="#ba672f" stroke="#ffffff" stroke-width="2"/>
    <text x="585" y="332" font-size="13.5" font-weight="700" fill="#ba672f" text-anchor="start">正式测试集（18.2%）</text>
    <text x="585" y="350" font-size="13.5" font-weight="600" fill="#14263d" text-anchor="start">+0.09 pp（5,500 题中多对 5 题）</text>
  </g>
</svg>
