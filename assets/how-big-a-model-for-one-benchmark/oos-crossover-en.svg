<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title-en desc-en">
  <title id="title-en">On CLINC150, the ranking depends on the share of out-of-scope requests</title>
  <desc id="desc-en">Accuracy gap in percentage points between local BGE-small and GPT-5.6 Luna as out-of-scope request share varies from 0% to 35%, crossing zero at 17.6% and reaching +0.09 pp on the 18.2% official test mix.</desc>
  <rect width="960" height="480" fill="#fafbfd"/>
  <g font-family="Lato, -apple-system, BlinkMacSystemFont, sans-serif">
    <!-- Header -->
    <text x="48" y="46" font-size="22" font-weight="700" fill="#14263d">On CLINC150, the ranking depends on the share of out-of-scope requests</text>
    <text x="48" y="74" font-size="15" fill="#526478">Local BGE-small minus GPT-5.6 Luna (percentage points), reweighted by measured in-scope and out-of-scope rates</text>

    <!-- Plot Background -->
    <rect x="110" y="110" width="770" height="270" fill="#ffffff"/>
    <rect x="497.6" y="110" width="382.4" height="270" fill="#f4f7fb" opacity="0.65"/>

    <!-- Horizontal Gridlines & Y Ticks (y = 245 - 45 * pp) -->
    <g stroke="#e6ecf2" stroke-width="1">
      <line x1="110" y1="110" x2="880" y2="110"/>
      <line x1="110" y1="155" x2="880" y2="155"/>
      <line x1="110" y1="200" x2="880" y2="200"/>
      <line x1="110" y1="290" x2="880" y2="290"/>
      <line x1="110" y1="335" x2="880" y2="335"/>
      <line x1="110" y1="380" x2="880" y2="380"/>
    </g>
    <!-- Zero baseline -->
    <line x1="110" y1="245" x2="880" y2="245" stroke="#8b9bb0" stroke-width="1.25"/>

    <!-- Y-axis Labels -->
    <g font-size="13" fill="#526478" text-anchor="end">
      <text x="96" y="115">+3 pp</text>
      <text x="96" y="160">+2 pp</text>
      <text x="96" y="205">+1 pp</text>
      <text x="96" y="250">0</text>
      <text x="96" y="295">−1 pp</text>
      <text x="96" y="340">−2 pp</text>
      <text x="96" y="385">−3 pp</text>
    </g>

    <!-- X-axis Ticks & Labels -->
    <g font-size="13" fill="#526478" text-anchor="middle">
      <text x="110" y="405">0%</text>
      <text x="220" y="405">5%</text>
      <text x="330" y="405">10%</text>
      <text x="440" y="405">15%</text>
      <text x="550" y="405">20%</text>
      <text x="660" y="405">25%</text>
      <text x="770" y="405">30%</text>
      <text x="880" y="405">35%</text>
    </g>
    <text x="495" y="442" font-size="14" font-weight="600" fill="#14263d" text-anchor="middle">Share of out-of-scope requests</text>

    <!-- Region labels -->
    <text x="128" y="136" font-size="13" font-weight="600" fill="#526478">Luna leads</text>
    <text x="514" y="136" font-size="13" font-weight="600" fill="#1e538a" text-anchor="start">Local BGE leads</text>

    <!-- Vertical tie line at 17.6% -->
    <line x1="497.6" y1="110" x2="497.6" y2="380" stroke="#7c8ea4" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="484" y="136" font-size="13" font-weight="600" fill="#526478" text-anchor="end">17.6% tie</text>

    <!-- Accuracy gap line: (0%, -2.844pp -> 373.0) to (35%, +2.806pp -> 118.7) -->
    <line x1="110" y1="373.0" x2="880" y2="118.7" stroke="#14263d" stroke-width="3" stroke-linecap="round"/>

    <!-- Callout 1: 10% OOS (-1.23 pp at x=330, y=300.35) -->
    <line x1="330" y1="300.35" x2="275" y2="215" stroke="#1e538a" stroke-width="1.5"/>
    <circle cx="330" cy="300.35" r="5.5" fill="#1e538a" stroke="#ffffff" stroke-width="2"/>
    <text x="275" y="188" font-size="13.5" font-weight="700" fill="#1e538a" text-anchor="middle">10% out-of-scope traffic</text>
    <text x="275" y="206" font-size="13.5" font-weight="600" fill="#14263d" text-anchor="middle">−1.23 pp (Luna 96.19% vs. 94.96%)</text>

    <!-- Callout 2: Official test mix 18.2% (+0.09 pp at x=510, y=240.9) -->
    <line x1="510" y1="240.9" x2="585" y2="312" stroke="#ba672f" stroke-width="1.5"/>
    <circle cx="510" cy="240.9" r="5.5" fill="#ba672f" stroke="#ffffff" stroke-width="2"/>
    <text x="585" y="332" font-size="13.5" font-weight="700" fill="#ba672f" text-anchor="start">Official test mix (18.2%)</text>
    <text x="585" y="350" font-size="13.5" font-weight="600" fill="#14263d" text-anchor="start">+0.09 pp (+5 of 5,500 items)</text>
  </g>
</svg>
