- title: "Why Agents Compromise Safety Under Pressure"
  authors: "<strong>Hengle JIANG</strong>, Ke Tang"
  venue: "ACL 2026 Findings"
  venue_short: "ACL'26"
  year: 2026
  image: /images/papers/agentsafe.png
  paper: "https://arxiv.org/pdf/2603.14975"
  abstract: "Why benign agents fail without adversarial attacks? We found that LLM-based Agents exhibit normative drift under compounding task constraints in real-world applications. We provide detailed pressure taxonomy and a safety framework to mitigate such behavior."
  highlight: true
  selected: true

